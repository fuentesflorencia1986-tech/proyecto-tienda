<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lumen & Arcana - Tienda Mística</title>
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>

  <!-- HEADER -->
  <header>
    <h1>🌙 Lumen & Arcana</h1>
    <div>
      <button id="btn-dark">Cambiar Tema</button>
      <button id="btnCarrito">🛒 Carrito (<span id="contadorCarrito">0</span>)</button>
    </div>
  </header>

  <!-- CATÁLOGO Y BUSCADOR -->
  <main>
    <div class="filtros">
      <input type="text" id="inputBusqueda" placeholder="Buscar mazo o producto...">
    </div>

    <!-- Grilla donde se inyectan las cards con map() -->
    <div id="grillaProdutos" class="grilla"></div>
  </main>

  <!-- CARRITO -->
  <section class="carrito-seccion">
    <h2>Carrito de Compras</h2>
    <div id="listaCarrito">
      <p id="carritoVacio">El carrito está vacío</p>
    </div>
    <div class="resumen">
      <h3>Total: <span id="total">$0</span></h3>
      <button id="btnVaciar">Vaciar Carrito</button>
    </div>
  </section>

  <!-- SCRIPT PRINCIPAL -->
  <script type="module" src="./js/main.js"></script>
</body>
</html>
